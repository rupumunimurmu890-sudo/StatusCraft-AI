  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
          console.error("Service worker registration failed:", err);
        });
      });
    }

    // ------------------------------------
    // 🆕 Install App button (PWA install prompt)
    // ------------------------------------

    let deferredInstallPrompt = null;

    const installBtn = document.getElementById("installAppBtn");

    window.addEventListener("beforeinstallprompt", function (event) {

      // Browser ka default mini-infobar rokte hain,
      // apna custom button dikhayenge
      event.preventDefault();

      deferredInstallPrompt = event;

      if (installBtn) {
        installBtn.style.display = "inline-flex";
      }
    });

    if (installBtn) {

      installBtn.addEventListener("click", async function () {

        if (!deferredInstallPrompt) return;

        deferredInstallPrompt.prompt();

        const choice = await deferredInstallPrompt.userChoice;

        // Ek baar prompt use ho gaya, dobara use nahi ho sakta
        deferredInstallPrompt = null;
        installBtn.style.display = "none";

        console.log("Install choice:", choice.outcome);
      });
    }

    // App already install ho chuka ho toh button hi mat dikhao
    window.addEventListener("appinstalled", function () {

      if (installBtn) {
        installBtn.style.display = "none";
      }

      deferredInstallPrompt = null;
    });
  </script>
